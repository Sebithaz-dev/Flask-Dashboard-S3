<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard NYC Citi Bike{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>NYC Citi Bike Dashboard</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {{ 'active' if resumen.page == 'overview' else '' }}">Vista General</a>
            <a href="/exploracion" class="nav-link {{ 'active' if resumen.page == 'exploracion' else '' }}">Exploración</a>
            <a href="/prediccion" class="nav-link {{ 'active' if resumen.page == 'prediccion' else '' }}">Predicción ML</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
