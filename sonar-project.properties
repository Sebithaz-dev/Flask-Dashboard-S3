sonar.projectKey=Sebithaz-dev_Flask-Dashboard-S3
sonar.organization=sebithaz-dev
sonar.projectName=Flask Dashboard S3
sonar.projectVersion=0.1.0

sonar.sources=app,run.py
sonar.tests=tests
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
