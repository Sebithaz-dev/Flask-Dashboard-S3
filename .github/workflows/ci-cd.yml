name: CI/CD Flask Dashboard

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar tests + cobertura
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t flask-dashboard-s3 .

      - name: Probar healthcheck del contenedor
        run: |
          docker run -d --name flask-health -p 5000:5000 flask-dashboard-s3
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              docker rm -f flask-health
              exit 0
            fi
            sleep 2
          done
          docker logs flask-health
          docker rm -f flask-health
          exit 1

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Activar deploy en Render
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}