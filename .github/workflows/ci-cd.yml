name: CI/CD Flask Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sebithaz-dev/flask-dashboard-s3

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Politica de calidad: todos los tests en verde y cobertura >= 70 %
      - name: Ejecutar tests + cobertura
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker (tag = SHA del commit)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} .

      - name: Probar healthcheck del contenedor
        run: |
          docker run -d --name flask-health -p 5000:5000 $IMAGE:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              docker rm -f flask-health
              exit 0
            fi
            sleep 2
          done
          docker logs flask-health
          docker rm -f flask-health
          exit 1

      - name: Guardar imagen para los siguientes jobs
        run: docker save $IMAGE:${{ github.sha }} -o image.tar

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-image
          path: image.tar
          retention-days: 1

  k8s-staging:
    name: Deploy en Kubernetes simulado (kind)
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Descargar imagen
        uses: actions/download-artifact@v8
        with:
          name: dashboard-image

      - name: Crear cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: citibike

      - name: Cargar imagen en el cluster
        run: |
          docker load -i image.tar
          kind load docker-image $IMAGE:${{ github.sha }} --name citibike

      - name: Aplicar manifiestos y fijar la imagen del commit
        run: |
          kubectl apply -k k8s/
          kubectl -n citibike set image deployment/dashboard dashboard=$IMAGE:${{ github.sha }}
          kubectl -n citibike annotate deployment/dashboard \
            kubernetes.io/change-cause="commit ${{ github.sha }} (run ${{ github.run_id }})" --overwrite
          kubectl -n citibike rollout status deployment/dashboard --timeout=180s

      - name: Smoke test a traves del Service
        run: |
          kubectl -n citibike port-forward service/dashboard 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/health

      - name: Diagnostico si falla
        if: failure()
        run: |
          kubectl -n citibike get all
          kubectl -n citibike describe deployment/dashboard
          kubectl -n citibike logs deployment/dashboard --tail=100

  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs: k8s-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v8
        with:
          name: dashboard-image

      - name: Push a GHCR (tag = SHA y latest)
        run: |
          docker load -i image.tar
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      # Opcional: definir la variable de repo RENDER_URL con la URL publica del servicio
      url: ${{ vars.RENDER_URL }}

    steps:
      - name: Activar deploy en Render (commit ${{ github.sha }})
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
