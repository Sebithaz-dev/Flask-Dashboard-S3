services:
  - type: web
    name: flask-dashboard-s3
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false  # el deploy solo lo dispara el pipeline tras pasar CI
    envVars:
      - key: FLASK_ENV
        value: production
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        value: citibike-datalake-seb-690247773624
      - key: S3_PARQUET_KEY
        value: curated/citibike_trips/citibike_dashboard_sample.parquet
      - key: S3_MODEL_PREFIX
        value: models/
