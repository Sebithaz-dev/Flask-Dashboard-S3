apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-training
  namespace: citibike
  labels:
    app.kubernetes.io/name: model-training
    app.kubernetes.io/part-of: citibike
spec:
  # Domingo 2am UTC, igual que train.yml
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: model-training
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: train
              image: ghcr.io/sebithaz-dev/model-training-s3:latest
              envFrom:
                - configMapRef:
                    name: citibike-config
                # Credenciales AWS opcionales (sin ellas el job corre en modo demo)
                - secretRef:
                    name: aws-credentials
                    optional: true
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
