# Orquestacion local del sistema completo.
#
#   docker compose up -d                     -> solo dashboard (usa el modelo publicado en S3)
#   docker compose --profile train up -d     -> entrena primero y luego levanta el dashboard
#   docker compose up -d --scale dashboard=3 -> 3 replicas detras del balanceador
#
# El job de entrenamiento se construye directo desde el repo Model-Training-S3.

name: citibike

services:
  train:
    profiles: ["train"]
    build:
      context: https://github.com/Sebithaz-dev/Model-Training-S3.git#main
    image: ghcr.io/sebithaz-dev/model-training-s3:latest
    env_file:
      - path: .env
        required: false
    environment:
      S3_DATA_KEY: ${S3_DATA_KEY:-curated/citibike_trips/citibike_curated.snappy.parquet}
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  dashboard:
    build:
      context: .
    image: ghcr.io/sebithaz-dev/flask-dashboard-s3:latest
    env_file:
      - path: .env
        required: false
    environment:
      GUNICORN_CMD_ARGS: "--workers=${GUNICORN_WORKERS:-2} --threads=${GUNICORN_THREADS:-4} --worker-class=gthread --timeout=60"
    expose:
      - "5000"
    depends_on:
      train:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 768m

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
